trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # - group: terraform-secrets   # only if you added secrets in Part 6.4
  - name: terraformVersion
    value: '1.8.0'

stages:
  - stage: Validate
    jobs:
      - job: fmt_validate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - script: terraform fmt -check -recursive
            displayName: 'Terraform fmt check'
          - script: terraform init -backend=false
            displayName: 'Terraform init (no backend)'
          - script: terraform validate
            displayName: 'Terraform validate'

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: terraform_plan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - task: TerraformTaskV4@4
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'sc-azure-backup-prod'
              backendAzureRmResourceGroupName: 'rg-tfstate'
              backendAzureRmStorageAccountName: 'sttfstatebackup'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'azure-backup-project.tfstate'
          - task: TerraformTaskV4@4
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'sc-azure-backup-prod'
              commandOptions: >-
                -out=tfplan
                -var-file="terraform.tfvars"
          - publish: tfplan
            artifact: tfplan

  - stage: Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: tfplan
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - task: TerraformTaskV4@4
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    backendServiceArm: 'sc-azure-backup-prod'
                    backendAzureRmResourceGroupName: 'rg-tfstate'
                    backendAzureRmStorageAccountName: 'sttfstatebackup'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'azure-backup-project.tfstate'
                - task: TerraformTaskV4@4
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    environmentServiceNameAzureRM: 'sc-azure-backup-prod'
                    commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'